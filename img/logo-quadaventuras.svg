<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="arcTop" d="M 22 96 A 90 90 0 0 1 178 96" fill="none"/>
    <path id="arcBottom" d="M 32 142 A 76 76 0 0 0 168 142" fill="none"/>
    <clipPath id="circleClip"><circle cx="100" cy="100" r="94"/></clipPath>

    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a028"/>
      <stop offset="55%" stop-color="#d97a1e"/>
      <stop offset="100%" stop-color="#b84a12"/>
    </linearGradient>
    <linearGradient id="bottomGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf3c0"/>
      <stop offset="100%" stop-color="#bcdce0"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffd35c"/>
      <stop offset="100%" stop-color="#f2a323"/>
    </radialGradient>
    <linearGradient id="quadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9e07a"/>
      <stop offset="100%" stop-color="#c3b418"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="94" fill="none" stroke="#111111" stroke-width="3"/>

  <g clip-path="url(#circleClip)">
    <circle cx="100" cy="100" r="94" fill="url(#skyGrad)"/>
    <rect x="0" y="152" width="200" height="48" fill="url(#bottomGrad)"/>
    <circle cx="96" cy="92" r="52" fill="url(#sunGrad)"/>
    <circle cx="96" cy="92" r="45" fill="none" stroke="#e08a1c" stroke-width="1.5" opacity="0.7"/>

    <!-- horizon -->
    <rect x="4" y="119" width="192" height="14" fill="#0a0a0a"/>

    <!-- quad + two riders silhouette -->
    <g fill="#0a0a0a">
      <!-- quad body -->
      <path d="M56,122 C64,110 80,104 97,105 C114,104 130,110 140,122
               L136,128 L60,128 Z"/>
      <!-- wheels, merging into horizon -->
      <circle cx="64" cy="127" r="18"/>
      <circle cx="132" cy="127" r="18"/>
      <!-- rider 1 (back/left) torso + head -->
      <ellipse cx="88" cy="102" rx="14" ry="21" transform="rotate(-10 88 102)"/>
      <circle cx="85" cy="78" r="11.5"/>
      <!-- rider 2 (front/right) torso + head -->
      <ellipse cx="107" cy="99" rx="14" ry="22" transform="rotate(8 107 99)"/>
      <circle cx="110" cy="74" r="11.5"/>
      <!-- arm to handlebar -->
      <path d="M118,90 L142,108 L137,115 L110,98 Z"/>
    </g>
  </g>

  <circle cx="100" cy="100" r="94" fill="none" stroke="#111111" stroke-width="2"/>

  <!-- QUAD -->
  <text font-family="'Arial Black','Arial',sans-serif" font-weight="900" font-size="50"
        fill="url(#quadGrad)" stroke="#111111" stroke-width="4.5" stroke-linejoin="round" paint-order="stroke" letter-spacing="-1">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">QUAD</textPath>
  </text>

  <!-- AVENTURAS -->
  <text font-family="'Arial Black','Arial',sans-serif" font-weight="900" font-style="italic" font-size="22"
        fill="#fdf3c0" stroke="#111111" stroke-width="3" stroke-linejoin="round" paint-order="stroke" letter-spacing="0">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">AVENTURAS</textPath>
  </text>
</svg>
